[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-docs"
version = "0.1.0"
description = "Generate professional documents from Markdown using LaTeX templates"
requires-python = ">=3.11"
dependencies = [
    "mistune>=3.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
interactive = [
    "simple-term-menu>=1.6",
]

[project.scripts]
md-docs = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
