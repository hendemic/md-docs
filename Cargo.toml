[package]
name = "md-docs"
version = "0.0.1"
edition = "2021"
description = "Convert Markdown files into professional PDFs using Typst templates"
license = "MIT"

[[bin]]
name = "mdocs"
path = "src/main.rs"

[dependencies]
# Typst compilation
typst = "0.14"
# typst-kit-fonts provides search_fonts_with() API for system font discovery
typst-as-lib = { version = "0.15", features = ["typst-kit-fonts"] }
typst-pdf = "0.14"

# Markdown parsing
pulldown-cmark = { version = "0.13", features = ["html"] }

# CLI
clap = { version = "4", features = ["derive"] }
colored = "2"
dialoguer = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_yml = "0.0.12"

# Serialization (JSON)
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Self-update
ureq = "3"
semver = "1"

# Filesystem
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
